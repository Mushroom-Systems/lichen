[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lichen"
version = "0.1.0"
description = "A drop-in, API-compatible replacement for Jev, TypeSafe's System One model, on open-weight models run locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jeff Ciesielski", email = "jeff@runmushroom.com"}]
requires-python = ">=3.10"
dependencies = ["numpy", "jinja2"]

# The llama.cpp backend needs llama-cpp-python, and a CUDA build of it to use a GPU
# (see the README); importing it at all needs libcuda, which is why it is an extra
# rather than a dependency. The vLLM backend reaches its engine over HTTP, so it
# needs nothing beyond the two above and has no extra of its own.
[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.35"]

[project.scripts]
lichen-server = "lichen.server:main"

[tool.setuptools.packages.find]
include = ["lichen*"]

[dependency-groups]
test = ["pytest"]
